<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheda Palestra</title>
<style>
  :root{
    --bg:#f2f2f7;
    --surface:#ffffff;
    --surface-2:#f7f7f9;
    --text:#1c1c1e;
    --text-2:#6e6e73;
    --border:#e5e5ea;
    --accent:#ff6b2c;
    --accent-2:#0a84ff;
    --success:#2fb350;
    --danger:#ff3b30;
    --danger-bg:#ffece8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --surface:#1c1c1e;
      --surface-2:#242426;
      --text:#f2f2f7;
      --text-2:#98989f;
      --border:#3a3a3c;
      --danger-bg:#3a1613;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --surface:#1c1c1e;
    --surface-2:#242426;
    --text:#f2f2f7;
    --text-2:#98989f;
    --border:#3a3a3c;
    --danger-bg:#3a1613;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  header{
    position:sticky;
    top:0;
    z-index:20;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
    border-bottom:1px solid var(--border);
  }
  h1{font-size:22px;margin:0 0 12px;font-weight:800;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:20px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tab.add{color:var(--accent);border-style:dashed;}
  main{padding:16px;max-width:640px;margin:0 auto 100px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ex-name{font-size:16px;font-weight:700;margin:0 0 2px;}
  .ex-group{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
  .ex-target{font-size:13px;color:var(--text-2);margin-top:6px;}
  .ex-note{font-size:13px;color:var(--text-2);margin-top:4px;font-style:italic;}
  .icon-btn{
    background:var(--surface-2);
    border:none;
    border-radius:8px;
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-2);
    cursor:pointer;
    font-size:15px;
    flex:0 0 auto;
  }
  .row-btns{display:flex;gap:6px;}
  .actions{display:flex;gap:8px;margin-top:12px;}
  .btn{
    border:none;
    border-radius:10px;
    padding:9px 14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-block{width:100%;padding:13px;border-radius:12px;font-size:15px;}
  .fab{
    position:fixed;
    right:20px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:56px;height:56px;
    border-radius:28px;
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:26px;
    box-shadow:0 6px 18px rgba(255,107,44,0.4);
    cursor:pointer;
    z-index:30;
  }
  .empty{text-align:center;color:var(--text-2);padding:60px 20px;font-size:14px;}
  .empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px;}
  .log-panel{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
  .log-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--text-2);font-weight:600;}
  input,select,textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-size:15px;
    color:var(--text);
    font-family:inherit;
    width:100%;
  }
  textarea{resize:vertical;min-height:44px;}
  .hist{margin-top:10px;}
  .hist-title{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
  .hist-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;
    border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-main{font-weight:600;}
  .hist-date{color:var(--text-2);font-size:12px;}
  .delta{font-weight:700;font-size:12px;}
  .delta.up{color:var(--success);}
  .delta.down{color:var(--danger);}
  .delta.flat{color:var(--text-2);}
  .hist-del{background:none;border:none;color:var(--text-2);font-size:16px;cursor:pointer;padding:2px 6px;}
  .link{color:var(--accent-2);font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;padding:4px 0;}
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:100;
  }
  .sheet{
    background:var(--surface);
    width:100%;max-width:640px;
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    max-height:85vh;overflow-y:auto;
  }
  .sheet h2{margin:0 0 14px;font-size:18px;}
  .sheet .field{margin-bottom:12px;}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .sheet-actions .btn{flex:1;}
  .status{font-size:12px;color:var(--text-2);text-align:center;padding:8px 0;}
  .banner{
    margin:0 16px 12px;padding:12px 14px;border-radius:12px;
    background:var(--surface-2);border:1px solid var(--border);
    font-size:13px;color:var(--text-2);
  }
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:20px;font-size:13.5px;font-weight:600;
    z-index:200;max-width:85vw;text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>

<header>
  <h1>💪 Scheda Palestra</h1>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<button class="fab" id="fabAdd" title="Aggiungi esercizio">+</button>

<div id="modalRoot"></div>

<script>
let db = null;
let giorni = [];
let esercizi = [];
let currentGiornoId = null;
let ready = false;
let canWrite = true;

const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now();
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', {day:'2-digit', month:'short'});
};

const GRUPPI = ['Petto','Schiena','Gambe','Spalle','Braccia','Core','Cardio','Altro'];

function main(){ return document.getElementById('main'); }
function tabsEl(){ return document.getElementById('tabs'); }

function render(){
  renderTabs();
  renderMain();
}

function renderTabs(){
  const el = tabsEl();
  el.innerHTML = '';
  const sorted = [...giorni].sort((a,b) => (a.ordine||0) - (b.ordine||0));
  sorted.forEach(g => {
    const t = document.createElement('button');
    t.className = 'tab' + (g.id === currentGiornoId ? ' active' : '');
    t.textContent = g.nome;
    t.onclick = () => { currentGiornoId = g.id; render(); };
    el.appendChild(t);
  });
  const add = document.createElement('button');
  add.className = 'tab add';
  add.textContent = '+ Giorno';
  add.onclick = openAddGiorno;
  el.appendChild(add);
}

function renderMain(){
  const el = main();
  el.innerHTML = '';

  if (!ready){
    el.innerHTML = '<div class="status">Caricamento scheda…</div>';
    return;
  }

  if (!db){
    el.innerHTML = `<div class="banner">Questa pagina non è collegata al salvataggio condiviso. Apri il link pubblicato da Claude (non l'anteprima) perché entrambi vediate gli stessi dati in tempo reale.</div>`;
  }

  if (giorni.length === 0){
    el.innerHTML += `<div class="empty"><b>Nessun giorno di allenamento</b>Crea il primo giorno (es. "Giorno A – Push") per iniziare ad aggiungere esercizi.</div>
      <button class="btn btn-primary btn-block" onclick="openAddGiorno()">+ Crea giorno di allenamento</button>`;
    return;
  }

  if (!currentGiornoId || !giorni.find(g => g.id === currentGiornoId)){
    currentGiornoId = [...giorni].sort((a,b)=>(a.ordine||0)-(b.ordine||0))[0].id;
  }

  const giorno = giorni.find(g => g.id === currentGiornoId);
  const list = esercizi.filter(e => e.giornoId === currentGiornoId).sort((a,b)=>(a.ordine||0)-(b.ordine||0));

  const head = document.createElement('div');
  head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;';
  head.innerHTML = `<div style="font-size:13px;color:var(--text-2);">${list.length} esercizi${giorno.note ? ' · ' + escapeHtml(giorno.note) : ''}</div>
    <button class="icon-btn" onclick="openEditGiorno('${giorno.id}')">✎</button>`;
  el.appendChild(head);

  if (list.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = `<b>Nessun esercizio in questo giorno</b>Tocca il pulsante + in basso per aggiungerne uno.`;
    el.appendChild(e);
    return;
  }

  list.forEach(ex => el.appendChild(renderEsercizio(ex)));
}

function renderEsercizio(ex){
  const card = document.createElement('div');
  card.className = 'card';

  const log = (ex.log || []).slice().sort((a,b) => a.data.localeCompare(b.data));
  const last = log[log.length - 1];
  const prev = log[log.length - 2];

  let targetLine = [];
  if (ex.serieTarget) targetLine.push(ex.serieTarget + ' serie');
  if (ex.ripetizioniTarget) targetLine.push(ex.ripetizioniTarget + ' rip.');
  if (ex.pesoTarget) targetLine.push(ex.pesoTarget + ' kg');
  if (ex.riposo) targetLine.push('riposo ' + ex.riposo);

  card.innerHTML = `
    <div class="ex-head">
      <div>
        <div class="ex-group">${escapeHtml(ex.gruppoMuscolare || 'Altro')}</div>
        <div class="ex-name">${escapeHtml(ex.nome)}</div>
        ${targetLine.length ? `<div class="ex-target">🎯 ${targetLine.join(' · ')}</div>` : ''}
        ${ex.note ? `<div class="ex-note">${escapeHtml(ex.note)}</div>` : ''}
        ${last ? `<div class="ex-target">Ultima volta: ${last.peso}kg × ${last.ripetizioni} (${fmtDate(last.data)}) ${deltaBadge(last, prev)}</div>` : ''}
      </div>
      <div class="row-btns">
        <button class="icon-btn" onclick="openEditEsercizio('${ex.id}')">✎</button>
        <button class="icon-btn" onclick="deleteEsercizio('${ex.id}')">🗑</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="toggleLogPanel('${ex.id}')">📈 Registra serie</button>
      ${log.length ? `<button class="btn btn-secondary" onclick="toggleHistPanel('${ex.id}')">Storico (${log.length})</button>` : ''}
    </div>
    <div id="logpanel-${ex.id}"></div>
    <div id="histpanel-${ex.id}"></div>
  `;
  return card;
}

function deltaBadge(last, prev){
  if (!prev) return '';
  const diff = (last.peso ?? 0) - (prev.peso ?? 0);
  if (diff > 0) return `<span class="delta up">▲ +${diff}kg</span>`;
  if (diff < 0) return `<span class="delta down">▼ ${diff}kg</span>`;
  return `<span class="delta flat">= invariato</span>`;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

// ---------- Log panel (registra serie) ----------
let openLogFor = null;
function toggleLogPanel(exId){
  openLogFor = (openLogFor === exId) ? null : exId;
  const panel = document.getElementById('logpanel-' + exId);
  if (!panel) return;
  if (openLogFor !== exId){ panel.innerHTML = ''; return; }
  panel.innerHTML = `
    <div class="log-panel">
      <div class="log-grid">
        <div class="field"><label>Data</label><input type="date" id="lg-data-${exId}" value="${todayISO()}"></div>
        <div class="field"><label>Peso (kg)</label><input type="number" step="0.5" inputmode="decimal" id="lg-peso-${exId}"></div>
        <div class="field"><label>Ripetizioni</label><input type="number" inputmode="numeric" id="lg-rip-${exId}"></div>
        <div class="field"><label>Serie fatte</label><input type="number" inputmode="numeric" id="lg-serie-${exId}"></div>
        <div class="field"><label>RPE (1-10)</label><input type="number" inputmode="numeric" id="lg-rpe-${exId}"></div>
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Note</label><input type="text" id="lg-note-${exId}" placeholder="es. buona tecnica, ultima serie a cedimento…"></div>
      <button class="btn btn-primary btn-block" onclick="saveLog('${exId}')">Salva</button>
    </div>`;
}

async function saveLog(exId){
  const peso = parseFloat(document.getElementById('lg-peso-' + exId).value);
  const rip = parseInt(document.getElementById('lg-rip-' + exId).value);
  const serie = parseInt(document.getElementById('lg-serie-' + exId).value);
  const rpe = document.getElementById('lg-rpe-' + exId).value;
  const note = document.getElementById('lg-note-' + exId).value.trim();
  const data = document.getElementById('lg-data-' + exId).value || todayISO();

  if (isNaN(peso) || isNaN(rip)){
    showToast('Inserisci almeno peso e ripetizioni.');
    return;
  }
  const ex = esercizi.find(e => e.id === exId);
  if (!ex) return;
  const entry = { data, peso, ripetizioni: rip, serie: isNaN(serie)?null:serie, rpe: rpe ? parseInt(rpe) : null, note: note || null, ts: Date.now() };
  const newLog = [...(ex.log || []), entry];
  await writeDoc('esercizi', exId, { log: newLog });
  openLogFor = null;
}

// ---------- History panel ----------
let openHistFor = null;
function toggleHistPanel(exId){
  openHistFor = (openHistFor === exId) ? null : exId;
  const panel = document.getElementById('histpanel-' + exId);
  if (!panel) return;
  if (openHistFor !== exId){ panel.innerHTML = ''; return; }
  const ex = esercizi.find(e => e.id === exId);
  const log = (ex.log || []).slice().sort((a,b) => b.data.localeCompare(a.data) || (b.ts||0)-(a.ts||0));
  panel.innerHTML = `<div class="hist"><div class="hist-title">Storico</div>${
    log.map((l, i) => `
      <div class="hist-item">
        <div>
          <div class="hist-main">${l.peso}kg × ${l.ripetizioni}${l.serie ? ' · ' + l.serie + ' serie' : ''}${l.rpe ? ' · RPE ' + l.rpe : ''}</div>
          <div class="hist-date">${fmtDate(l.data)}${l.note ? ' — ' + escapeHtml(l.note) : ''}</div>
        </div>
        <button class="hist-del" onclick="deleteLogEntry('${exId}', ${log.length - 1 - i})">✕</button>
      </div>`).join('')
  }</div>`;
}

async function deleteLogEntry(exId, idxAsc){
  const ex = esercizi.find(e => e.id === exId);
  if (!ex) return;
  const sorted = (ex.log || []).slice().sort((a,b) => a.data.localeCompare(b.data) || (a.ts||0)-(b.ts||0));
  sorted.splice(idxAsc, 1);
  await writeDoc('esercizi', exId, { log: sorted });
}

// ---------- Giorni CRUD ----------
function openAddGiorno(){
  showModal(`
    <h2>Nuovo giorno di allenamento</h2>
    <div class="field"><label>Nome</label><input type="text" id="mg-nome" placeholder="es. Giorno A – Push"></div>
    <div class="field"><label>Note (opzionale)</label><input type="text" id="mg-note" placeholder="es. focus petto/spalle/tricipiti"></div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveGiorno()">Crea</button>
    </div>
  `);
}

function openEditGiorno(id){
  const g = giorni.find(x => x.id === id);
  if (!g) return;
  showModal(`
    <h2>Modifica giorno</h2>
    <div class="field"><label>Nome</label><input type="text" id="mg-nome" value="${escapeAttr(g.nome)}"></div>
    <div class="field"><label>Note (opzionale)</label><input type="text" id="mg-note" value="${escapeAttr(g.note||'')}"></div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveGiorno('${id}')">Salva</button>
    </div>
    <button class="link" style="color:var(--danger);margin-top:10px;" onclick="deleteGiorno('${id}')">Elimina questo giorno e i suoi esercizi</button>
  `);
}

async function saveGiorno(id){
  const nome = document.getElementById('mg-nome').value.trim();
  const note = document.getElementById('mg-note').value.trim();
  if (!nome){ showToast('Inserisci un nome.'); return; }
  if (id){
    await writeDoc('giorni', id, { nome, note: note || null });
  } else {
    const newId = uid();
    const ordine = giorni.length;
    await writeDoc('giorni', newId, { nome, note: note || null, ordine });
    currentGiornoId = newId;
  }
  closeModal();
}

function deleteGiorno(id){
  showConfirm('Eliminare questo giorno e tutti i suoi esercizi?', async () => {
    const toDelete = esercizi.filter(e => e.giornoId === id);
    for (const e of toDelete){ await deleteDoc('esercizi', e.id); }
    await deleteDoc('giorni', id);
    currentGiornoId = null;
  });
}

// ---------- Esercizi CRUD ----------
function openAddEsercizio(){
  if (!currentGiornoId){ openAddGiorno(); return; }
  showModal(esercizioForm());
}

function openEditEsercizio(id){
  const ex = esercizi.find(e => e.id === id);
  if (!ex) return;
  showModal(esercizioForm(ex));
}

function esercizioForm(ex){
  const gruppoOpts = GRUPPI.map(g => `<option value="${g}" ${ex && ex.gruppoMuscolare===g?'selected':''}>${g}</option>`).join('');
  return `
    <h2>${ex ? 'Modifica esercizio' : 'Nuovo esercizio'}</h2>
    <div class="field"><label>Nome esercizio</label><input type="text" id="me-nome" value="${ex?escapeAttr(ex.nome):''}" placeholder="es. Panca piana"></div>
    <div class="field"><label>Gruppo muscolare</label><select id="me-gruppo">${gruppoOpts}</select></div>
    <div class="log-grid">
      <div class="field"><label>Serie target</label><input type="number" id="me-serie" value="${ex?.serieTarget ?? ''}"></div>
      <div class="field"><label>Rip. target</label><input type="number" id="me-rip" value="${ex?.ripetizioniTarget ?? ''}"></div>
      <div class="field"><label>Peso (kg)</label><input type="number" step="0.5" id="me-peso" value="${ex?.pesoTarget ?? ''}"></div>
    </div>
    <div class="field"><label>Recupero (es. 90s)</label><input type="text" id="me-riposo" value="${ex?escapeAttr(ex.riposo||''):''}"></div>
    <div class="field"><label>Note tecniche</label><textarea id="me-note">${ex?escapeHtml(ex.note||''):''}</textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveEsercizio(${ex ? `'${ex.id}'` : 'null'})">${ex?'Salva':'Aggiungi'}</button>
    </div>
    ${ex ? `<button class="link" style="color:var(--danger);margin-top:10px;" onclick="deleteEsercizio('${ex.id}')">Elimina esercizio</button>` : ''}
  `;
}

async function saveEsercizio(id){
  const nome = document.getElementById('me-nome').value.trim();
  if (!nome){ showToast("Inserisci il nome dell'esercizio."); return; }
  const payload = {
    nome,
    gruppoMuscolare: document.getElementById('me-gruppo').value,
    serieTarget: numOrNull('me-serie'),
    ripetizioniTarget: numOrNull('me-rip'),
    pesoTarget: numOrNull('me-peso'),
    riposo: document.getElementById('me-riposo').value.trim() || null,
    note: document.getElementById('me-note').value.trim() || null,
  };
  if (id){
    await writeDoc('esercizi', id, payload);
  } else {
    const newId = uid();
    const ordine = esercizi.filter(e => e.giornoId === currentGiornoId).length;
    await writeDoc('esercizi', newId, { ...payload, giornoId: currentGiornoId, ordine, log: [] });
  }
  closeModal();
}

function deleteEsercizio(id){
  showConfirm('Eliminare questo esercizio e il suo storico?', async () => {
    await deleteDoc('esercizi', id);
  });
}

function numOrNull(id){
  const v = document.getElementById(id).value;
  return v === '' ? null : parseFloat(v);
}
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

// ---------- Modal ----------
function showModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov" onclick="if(event.target.id==='ov')closeModal()"><div class="sheet">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function showConfirm(message, onYes){
  showModal(`
    <h2>Conferma</h2>
    <p style="font-size:14px;color:var(--text-2);margin-top:-6px;">${escapeHtml(message)}</p>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" id="confirmYes" style="background:var(--danger);">Elimina</button>
    </div>
  `);
  document.getElementById('confirmYes').onclick = () => { closeModal(); onYes(); };
}

let toastTimer = null;
function showToast(message){
  const root = document.getElementById('modalRoot');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = message;
  root.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.remove(); }, 2800);
}

// ---------- DB wiring ----------
async function writeDoc(col, id, data){
  if (!db){ showToast('Salvataggio non disponibile: apri il link pubblicato.'); return; }
  try{
    await db.collection(col).doc(id).set({ ...(col==='giorni'? (giorni.find(g=>g.id===id)||{}) : (esercizi.find(e=>e.id===id)||{})), id, ...data });
  }catch(err){
    console.error(err);
    if (err && err.code === 'invalid_argument' && canWrite === true){
      canWrite = false;
      showToast('Non hai i permessi per modificare la scheda su questa pagina.');
    } else {
      showToast('Salvataggio non riuscito, riprova.');
    }
  }
}
async function deleteDoc(col, id){
  if (!db) return;
  try{ await db.collection(col).doc(id).delete(); }
  catch(err){ console.error(err); showToast('Eliminazione non riuscita, riprova.'); }
}

async function init(){
  try{
    if (window.claude && window.claude.use){
      db = await window.claude.use('db');
    }
  }catch(e){ db = null; }

  if (db){
    db.collection('giorni').onSnapshot(snap => {
      giorni = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      ready = true;
      render();
    }, err => { console.error('giorni error', err); ready = true; render(); });

    db.collection('esercizi').onSnapshot(snap => {
      esercizi = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      ready = true;
      render();
    }, err => { console.error('esercizi error', err); ready = true; render(); });

    setTimeout(() => { ready = true; render(); }, 1500);
  } else {
    ready = true;
    render();
  }
}

document.getElementById('fabAdd').addEventListener('click', openAddEsercizio);
init();
</script>
